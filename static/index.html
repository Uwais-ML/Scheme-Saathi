<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Scheme Saathi – सरकारी योजना सहायक" />
  <title>Scheme Saathi – योजना साथी</title>
  <link rel="stylesheet" href="style.css?v=20261111-1" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="app-header" role="banner">
  <div class="header-inner">
    <div class="app-brand">
      <span class="brand-icon" aria-hidden="true">🤝</span>
      <span class="brand-name">योजना साथी</span>
    </div>

    <!-- Language picker -->
    <div class="lang-picker" role="group" aria-label="भाषा चुनें / Choose language">
      <button class="lang-btn active" data-lang="hi" aria-pressed="true">हिन्दी</button>
      <button class="lang-btn" data-lang="en" aria-pressed="false">English</button>
      <button class="lang-btn" data-lang="mr" aria-pressed="false">मराठी</button>
      <button class="lang-btn" data-lang="ta" aria-pressed="false">தமிழ்</button>
    </div>
  </div>
</header>

<!-- ===== SAFETY / CRISIS STRIP ===== -->
<div id="safety-strip" class="safety-strip" role="alert" hidden>
  <div class="safety-strip-inner">
    <span class="safety-icon">🚨</span>
    <span class="safety-text" id="safety-strip-text">सुरक्षा सहायता</span>
    <div class="safety-actions" id="safety-strip-actions">
      <a href="tel:112" class="helpline-btn" id="safety-primary-btn">📞 112 (आपातकाल)</a>
      <a href="tel:1930" class="helpline-btn cyber" id="safety-cyber-btn">🛡️ 1930 (साइबर ठगी)</a>
    </div>
  </div>
</div>

<!-- ===== HOUSEHOLD MEMBER CHIPS BAR ===== -->
<div class="member-chips-bar" id="member-chips-bar" role="group" aria-label="परिवार के सदस्य">
  <div class="member-chips-inner" id="member-chips-container">
    <button class="member-chip active" id="chip-self">
      <span class="chip-avatar">👤</span>
      <span class="chip-name">मुख्य सदस्य (स्वयं)</span>
    </button>
    <button class="member-chip add-chip" id="add-member-btn" title="नया सदस्य जोड़ें">
      <span>➕ नया सदस्य</span>
    </button>
  </div>
</div>

<!-- ===== NOTICES BAR ===== -->
<div id="notices-bar" class="notices-bar" role="status" aria-live="polite" hidden></div>

<!-- ===== MAIN LAYOUT ===== -->
<main class="app-main" role="main">

  <!-- LEFT PANEL: Document Checklist & Acquisition Help -->
  <aside class="side-panel" id="checklist-panel" aria-label="दस्तावेज़ सूची">
    <h2 class="panel-title">📋 दस्तावेज़</h2>
    <ul class="checklist" id="checklist-list" role="list">
      <li class="checklist-empty" id="checklist-empty">
        <span>अभी कोई दस्तावेज़ नहीं</span>
      </li>
    </ul>

    <!-- How to get document card -->
    <div class="card doc-help-card" id="doc-help-card" hidden>
      <h3 class="card-subtitle">ℹ️ दस्तावेज़ सहायता</h3>
      <div id="doc-help-content" class="doc-help-content"></div>
    </div>
  </aside>

  <!-- CENTRE: Chat area -->
  <section class="chat-section" aria-label="बातचीत">
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-atomic="false">
      <!-- messages injected by JS -->
    </div>

    <!-- Input bar -->
    <div class="input-bar" role="form" aria-label="संदेश भेजें">
      <label class="sr-only" for="text-input">संदेश लिखें</label>
      <textarea
        id="text-input"
        class="text-input"
        placeholder="यहाँ लिखें या माइक दबाएँ…"
        rows="1"
        aria-multiline="false"
      ></textarea>

      <!-- Upload button -->
      <label class="icon-btn upload-btn" for="file-input" title="दस्तावेज़ अपलोड करें" aria-label="दस्तावेज़ अपलोड करें">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </label>
      <input
        type="file"
        id="file-input"
        accept=".jpg,.jpeg,.png,.pdf,.webp"
        capture="environment"
        style="display:none"
        aria-hidden="true"
        multiple
      />

      <!-- Send button -->
      <button class="icon-btn send-btn" id="send-btn" title="भेजें" aria-label="संदेश भेजें">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- RIGHT PANEL: Form Preview & Ranked Schemes -->
  <aside class="side-panel" id="form-panel" aria-label="फ़ॉर्म और योजनाएँ">
    
    <!-- Ranked schemes card -->
    <div class="ranked-schemes-card" id="ranked-schemes-card" hidden>
      <h2 class="panel-title">⭐ सर्वश्रेष्ठ योजना विकल्प</h2>
      <div id="ranked-schemes-list" class="ranked-list"></div>
      <button class="action-btn-sm next-option-btn" id="next-scheme-btn" hidden>अगला विकल्प देखें ➔</button>
    </div>

    <h2 class="panel-title">📄 आवेदन फ़ॉर्म</h2>
    <div id="form-preview-content" class="form-preview-empty">
      <span>कोई योजना अभी नहीं चुनी</span>
    </div>
    <div class="form-actions" id="form-actions" hidden>
      <button class="confirm-btn" id="confirm-btn" aria-label="फ़ॉर्म की जानकारी सही है">
        ✅ जानकारी सही है
      </button>
    </div>

    <!-- Offline Packet & Grievance Actions -->
    <div class="offline-actions-card" id="offline-actions-card">
      <h3 class="card-subtitle">🖨️ ऑफ़लाइन सहायता पत्र</h3>
      <div class="button-group">
        <button class="secondary-action-btn" id="btn-handoff-packet" title="कार्यालय सहायता पर्ची बनाएं">
          📄 सहायता पर्ची प्रिंट करें
        </button>
        <button class="secondary-action-btn" id="btn-grievance-draft" title="शिकायत पत्र तैयार करें">
          ✍️ शिकायत पत्र तैयार करें
        </button>
      </div>
    </div>
  </aside>

</main>

<!-- ===== MICROPHONE FAB ===== -->
<button
  class="mic-fab"
  id="mic-btn"
  aria-label="बोलें – माइक दबाएँ"
  aria-pressed="false"
  title="बोलें"
>
  <svg class="mic-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
    <path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <span class="mic-label" aria-hidden="true">बोलें</span>
</button>

<!-- ===== LOADING OVERLAY ===== -->
<div class="loading-overlay" id="loading-overlay" role="status" aria-live="assertive" hidden>
  <div class="loading-spinner" aria-hidden="true"></div>
  <span class="loading-text">सोच रहा हूँ…</span>
</div>

<script src="app.js?v=20261111-1"></script>
</body>
</html>
